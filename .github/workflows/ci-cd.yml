name: CI/CD

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

env:
  # Configurações não sigilosas: GitHub Variables (Settings > Secrets and variables > Actions > Variables)
  NODE_VERSION: ${{ vars.NODE_VERSION || '24' }}
  APP_URL: ${{ vars.APP_URL || 'http://localhost:3333' }}
  REGISTRY: ghcr.io

jobs:
  ci:
    name: CI - testes e build
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Preparar o ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes automatizados
        run: npm run test:ci
        env:
          # Credenciais: GitHub Secrets (Settings > Secrets and variables > Actions > Secrets)
          JWT_SECRET: ${{ secrets.JWT_SECRET_TEST }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY_TEST }}

      - name: Construir a aplicação
        run: npm run build

      - name: Armazenar o artefato gerado
        uses: actions/upload-artifact@v4
        with:
          name: smartbarber-api-${{ github.sha }}
          path: |
            dist/
            package.json
            package-lock.json
          retention-days: 30

      - name: Validar o build da imagem Docker (sem publicar)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: smartbarber-api:pr-${{ github.event.pull_request.number }}

  delivery:
    name: CD - publicar imagem Docker (GHCR)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Obter o código do repositório
        uses: actions/checkout@v4

      - name: Definir nome da imagem
        run: echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Preparar o Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gerar tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=v1.0.${{ github.run_number }}
            type=sha,prefix=sha-

      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo da publicação
        run: |
          {
            echo "## Imagem publicada"
            echo ""
            echo "Versão: \`v1.0.${{ github.run_number }}\` (commit \`${GITHUB_SHA::7}\`)"
            echo ""
            echo '```bash'
            echo "docker pull ${IMAGE_NAME}:v1.0.${{ github.run_number }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
